# 定义流水线阶段，按顺序执行
stages:
  - build
  - deploy
  - verify

# 全局变量
variables:
  APP_NAME: "hello-gitlab-ci"
  APP_PORT: "5001"                          # 用5001避免和之前的应用冲突
  DEPLOY_HOST: "192.168.65.100"             # 部署到虚拟机1！
  IMAGE_NAME: "$APP_NAME:$CI_PIPELINE_IID"  # CI_PIPELINE_IID是GitLab内置变量

# 构建镜像
build:
  stage: build
  tags:
    - docker                                # 指定用带docker标签的Runner
  script:
    - echo "🔨 开始构建镜像：$IMAGE_NAME"
    - docker build -t $IMAGE_NAME .
    - echo "✅ 镜像构建完成！"
  only:
    - main                                  # 只有main分支触发

# 部署应用
deploy:
  stage: deploy
  tags:
    - docker
  before_script:
    - echo "🔑 配置SSH免密登录..."
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa    # 从GitLab变量读取SSH私钥
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
  script:
    - echo "🚀 开始部署到 $DEPLOY_HOST ..."
    - |
      ssh devops@$DEPLOY_HOST << REMOTE
        docker stop $APP_NAME 2>/dev/null || true
        docker rm $APP_NAME 2>/dev/null || true
        docker run -d \
          --name $APP_NAME \
          --restart always \
          -p $APP_PORT:5000 \
          $IMAGE_NAME
      REMOTE
    - echo "✅ 部署完成！"
  only:
    - main

# 验证部署
verify:
  stage: verify
  tags:
    - docker
  script:
    - echo "🔍 验证部署..."
    - sleep 5
    - curl -f http://$DEPLOY_HOST:$APP_PORT/health
    - echo "✅ 服务健康检查通过！"
  only:
    - main
