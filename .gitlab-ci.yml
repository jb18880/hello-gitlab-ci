stages:
  - build
  - deploy
  - verify

variables:
  APP_NAME: "hello-gitlab-ci"
  APP_PORT: "5001"
  DEPLOY_HOST: "192.168.65.100"
  HARBOR_HOST: "192.168.65.102:8080"
  HARBOR_PROJECT: "cicd-demo"
  IMAGE_NAME: "$HARBOR_HOST/$HARBOR_PROJECT/$APP_NAME:$CI_PIPELINE_IID"

build:
  stage: build
  tags:
    - docker
  script:
    - echo "🔨 构建镜像：$IMAGE_NAME"
    - docker build -t $IMAGE_NAME .
    - echo "📦 推送镜像到Harbor..."
    - docker login $HARBOR_HOST -u $HARBOR_USER -p $HARBOR_PASS
    - docker push $IMAGE_NAME
    - echo "✅ 镜像推送完成！"
    - docker rmi $IMAGE_NAME || true
  only:
    - main

deploy:
  stage: deploy
  tags:
    - docker
  before_script:
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
  script:
    - echo "🚀 部署到 $DEPLOY_HOST ..."
    - |
      ssh devops@$DEPLOY_HOST << REMOTE
        docker login $HARBOR_HOST -u $HARBOR_USER -p $HARBOR_PASS
        docker pull $IMAGE_NAME
        docker stop $APP_NAME 2>/dev/null || true
        docker rm $APP_NAME 2>/dev/null || true
        docker run -d \
          --name $APP_NAME \
          --restart always \
          -p $APP_PORT:5000 \
          $IMAGE_NAME
        docker logout $HARBOR_HOST
      REMOTE
    - echo "✅ 部署完成！"
  only:
    - main

verify:
  stage: verify
  tags:
    - docker
  script:
    - echo "🔍 验证部署..."
    - sleep 5
    - curl -f http://$DEPLOY_HOST:$APP_PORT/health
    - echo "✅ 健康检查通过！"
  only:
    - main
