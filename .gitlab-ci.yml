stages:
  - build
  - test
  - deploy
  - verify
  - notify

variables:
  APP_NAME: "hello-gitlab-ci"
  APP_PORT: "5001"
  DEPLOY_HOST: "192.168.65.100"
  HARBOR_HOST: "192.168.65.102:8080"
  HARBOR_PROJECT: "cicd-demo"
  IMAGE_NAME: "$HARBOR_HOST/$HARBOR_PROJECT/$APP_NAME:$CI_PIPELINE_IID"

build:
  stage: build
  tags:
    - docker
  script:
    - echo "🔨 构建镜像：$IMAGE_NAME"
    - docker build -t $IMAGE_NAME .
    - echo "📦 推送镜像到Harbor..."
    - docker login $HARBOR_HOST -u $HARBOR_USER -p $HARBOR_PASS
    - docker push $IMAGE_NAME
    - echo "✅ 镜像推送完成！"
    - docker rmi $IMAGE_NAME || true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
    - if: $CI_COMMIT_BRANCH == "dev"
      when: on_success

test: 
  stage: test
  tags: 
    - docker
  image: python:3.11-slim
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
    - if: $CI_COMMIT_BRANCH == "dev"
      when: on_success
  before_script: 
    - pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple --no-cache-dir
  script: 
    - python -m pytest tests/ -v
  

deploy:
  stage: deploy
  tags:
    - docker
  before_script:
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
  script:
    - echo "🚀 部署到 $DEPLOY_HOST ..."
    - |
      ssh devops@$DEPLOY_HOST << REMOTE
        docker login $HARBOR_HOST -u $HARBOR_USER -p $HARBOR_PASS
        docker pull $IMAGE_NAME
        docker stop $APP_NAME 2>/dev/null || true
        docker rm $APP_NAME 2>/dev/null || true
        docker run -d \
          --name $APP_NAME \
          --restart always \
          -p $APP_PORT:5000 \
          $IMAGE_NAME
        docker logout $HARBOR_HOST
      REMOTE
    - echo "✅ 部署完成！"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success

verify:
  stage: verify
  tags:
    - docker
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - echo "🔍 验证部署..."
    - sleep 5
    - curl -f http://$DEPLOY_HOST:$APP_PORT/health
    - echo "✅ 健康检查通过！"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success

.notify_template: &notify_template
  stage: notify
  image: alpine:latest
  before_script:
    - apk add --no-cache curl

notify-success:
  <<: *notify_template
  script:
    - |
      curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
        -d "chat_id=$TELEGRAM_CHAT_ID" \
        -d "parse_mode=Markdown" \
        -d "text=✅ *流水线成功*%0A*项目*：$CI_PROJECT_NAME%0A*分支*：$CI_COMMIT_BRANCH%0A*提交*：$CI_COMMIT_MESSAGE%0A*耗时*：${CI_PIPELINE_DURATION}秒"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success

notify-failure:
  <<: *notify_template
  script:
    - |
      curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
        -d "chat_id=$TELEGRAM_CHAT_ID" \
        -d "parse_mode=Markdown" \
        -d "text=❌ *流水线失败*%0A*项目*：$CI_PROJECT_NAME%0A*分支*：$CI_COMMIT_BRANCH%0A*提交*：$CI_COMMIT_MESSAGE%0A*详情*：$CI_PIPELINE_URL"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_failure
